name: Soft fork build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soft-fork-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: AmanoTeam/Kahon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@main

      - name: Resolve latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          values="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName,publishedAt --jq '.tagName + "\n" + .publishedAt')"
          tag="$(sed -n 1p <<<"${values}")"
          published_at="$(sed -n 2p <<<"${values}")"
          {
            echo "tag=${tag}"
            echo "published_at=${published_at}"
          } >> "${GITHUB_OUTPUT}"
          echo "Latest upstream release is ${tag} (published ${published_at})"

      - name: Check whether release already published in this repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.upstream.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${{ steps.upstream.outputs.tag }} already exists in ${GITHUB_REPOSITORY}, nothing to do."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Gate for scheduled runs: rerunning an attempt that already failed
          # for the same upstream release and the same fork commit will fail
          # the same way, so skip it until either side changes. Lookup keys:
          #  - most recent failed run of this workflow (skipped runs conclude
          #    "success", cancelled ones never got a conclusion - both ignored);
          #  - same commit: the failure must have run off the current HEAD;
          #  - upstream unchanged: no release published after that failure.
          # Manual workflow_dispatch runs always retry, bypassing this gate.
          skip_reason="Release ${{ steps.upstream.outputs.tag }} is missing, building it."
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last_failure="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "Soft fork build" \
              --limit 20 \
              --json conclusion,headSha,createdAt \
              --jq 'map(select(.conclusion == "failure")) | .[0] // empty')"
            if [ -n "${last_failure}" ]; then
              failed_sha="$(jq --raw-output '.headSha' <<<"${last_failure}")"
              failed_at="$(jq --raw-output '.createdAt' <<<"${last_failure}")"
              published_at="${{ steps.upstream.outputs.published_at }}"
              if [ "${failed_sha}" = "${GITHUB_SHA}" ] \
                && [[ ! "${published_at}" > "${failed_at}" ]]; then
                skip_reason="Previous run already failed for ${failed_sha} at ${failed_at}, and upstream (latest release ${{ steps.upstream.outputs.tag }}, published ${published_at}) and this repository are unchanged; skipping."
                echo "::notice::${skip_reason} Regenerate patches and push, or run the workflow manually to retry."
                echo "skip=true" >> "${GITHUB_OUTPUT}"
                echo "${skip_reason}"
                exit 0
              fi
            fi
          fi

          echo "${skip_reason}."
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Clone upstream release tag
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the tag to its commit via the API, then make sure the clone is
          # exactly that commit: if the tag moves between scheduling and cloning,
          # the build would silently compile a tree the patches were not made for
          # (upstream has re-pointed its tags before, producing this exact failure).
          tag="${{ steps.upstream.outputs.tag }}"
          ref="$(gh api "repos/${UPSTREAM_REPO}/git/ref/tags/${tag}")"
          tag_commit="$(jq --raw-output '.object.sha' <<<"${ref}")"
          if [ "$(jq --raw-output '.object.type' <<<"${ref}")" = "tag" ]; then
            # Annotated tag: dereference to the commit it points at
            tag_commit="$(gh api "repos/${UPSTREAM_REPO}/git/tags/${tag_commit}" --jq '.object.sha')"
          fi
          echo "Upstream tag ${tag} resolves to commit ${tag_commit}"

          git clone --depth 1 --branch "${tag}" \
            "https://github.com/${UPSTREAM_REPO}.git" upstream
          actual="$(git -C upstream rev-parse HEAD)"
          if [ "${actual}" != "${tag_commit}" ]; then
            echo "Clone checked out ${actual}, tag has moved; checking out the resolved commit."
            git -C upstream fetch --depth 1 origin "${tag_commit}"
            git -C upstream checkout --detach "${tag_commit}"
          fi
          git -C upstream submodule update --init --recursive

      - name: Apply patches
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: |
          for patch in $(find ../patches -type f \( -name '*.patch' -o -name '*.diff' \) | sort); do
            echo "Applying ${patch}"
            if ! git apply "${patch}"; then
              patch -p1 < "${patch}"
            fi
          done
          git status --short

      - name: Set up JDK 25
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@main
        with:
          java-version: 25
          distribution: temurin

      - name: Assemble APK
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: ./gradlew --no-daemon assembleRelease

      - name: Set KAHON_VERSION
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: echo "KAHON_VERSION=v$(grep --only-matching --perl-regexp 'versionName\s=\s\"\K([0-9\.]+)' './app/build.gradle.kts')+$(git rev-parse --short 'HEAD')" >> "${GITHUB_ENV}"

      - name: Sign APKs
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Add a base64-encoded release keystore plus KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to the repository secrets."
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.jks"
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          zipalign="$(ls -1 "${sdk}"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)"
          apksigner="$(ls -1 "${sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "${zipalign}" ] || [ -z "${apksigner}" ]; then
            echo "::error::Android build-tools (zipalign/apksigner) not found under ${sdk}"
            exit 1
          fi

          outdir="./app/build/outputs/apk/release"
          for unsigned in "${outdir}"/*-unsigned.apk; do
            basename="${unsigned%-unsigned.apk}"
            aligned="${basename}-aligned.apk"
            signed="${basename}.apk"
            "${zipalign}" -f -p 4 "${unsigned}" "${aligned}"
            "${apksigner}" sign \
              --ks "${keystore}" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "${signed}" \
              "${aligned}"
            "${apksigner}" verify --print-certs "${signed}"
            echo "Signed: ${signed}"
          done

      - name: Publish APKs as GitHub Release
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.upstream.outputs.tag }}"
          outdir="./app/build/outputs/apk/release"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Kahon ${tag}" \
            --generate-notes \
            $(for f in "${outdir}"/*-release.apk; do
              abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
              echo "${f}#kahon_${KAHON_VERSION}_${abi}.apk"
            done)
