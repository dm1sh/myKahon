name: Soft fork build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soft-fork-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: AmanoTeam/Kahon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@main

      - name: Resolve latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName --jq '.tagName')"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Latest upstream release is ${tag}"

      - name: Check whether release already published in this repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.upstream.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${{ steps.upstream.outputs.tag }} already exists in ${GITHUB_REPOSITORY}, nothing to do."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${{ steps.upstream.outputs.tag }} is missing, building it."
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Clone upstream release tag
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.upstream.outputs.tag }}" \
            "https://github.com/${UPSTREAM_REPO}.git" upstream
          git -C upstream submodule update --init --recursive

      - name: Apply patches
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: |
          for patch in $(find ../patches -type f \( -name '*.patch' -o -name '*.diff' \) | sort); do
            echo "Applying ${patch}"
            if ! git apply "${patch}"; then
              patch -p1 < "${patch}"
            fi
          done
          git status --short

      - name: Set up JDK 25
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@main
        with:
          java-version: 25
          distribution: temurin

      - name: Assemble APK
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: ./gradlew --no-daemon assembleRelease

      - name: Set KAHON_VERSION
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        run: echo "KAHON_VERSION=v$(grep --only-matching --perl-regexp 'versionName\s=\s\"\K([0-9\.]+)' './app/build.gradle.kts')+$(git rev-parse --short 'HEAD')" >> "${GITHUB_ENV}"

      - name: Sign APK
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Add a base64-encoded release keystore plus KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to the repository secrets."
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.jks"
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          zipalign="$(ls -1 "${sdk}"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)"
          apksigner="$(ls -1 "${sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "${zipalign}" ] || [ -z "${apksigner}" ]; then
            echo "::error::Android build-tools (zipalign/apksigner) not found under ${sdk}"
            exit 1
          fi

          outdir="./app/build/outputs/apk/release"
          aligned="${outdir}/app-release-aligned.apk"
          signed="${outdir}/app-release-signed.apk"
          "${zipalign}" -f -p 4 "${outdir}/app-release-unsigned.apk" "${aligned}"
          "${apksigner}" sign \
            --ks "${keystore}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${signed}" \
            "${aligned}"
          "${apksigner}" verify --print-certs "${signed}"
          echo "Signed APK: ${signed}"

      - name: Publish APK as GitHub Release
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.upstream.outputs.tag }}"
          apk="./app/build/outputs/apk/release/app-release-signed.apk"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Kahon ${tag}" \
            --generate-notes \
            "${apk}#kahon_${KAHON_VERSION}.apk"
